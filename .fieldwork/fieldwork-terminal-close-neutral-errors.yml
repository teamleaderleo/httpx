name: Fieldwork terminal close neutral errors

on:
  pull_request:
    paths:
      - 'httpx/_models.py'
      - 'httpx/_client.py'
      - 'tests/models/test_async_response_close_terminal_unknown.py'
      - '.github/workflows/fieldwork-terminal-close-neutral-errors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt httpcore==1.0.9 anyio==4.12.1
      - run: |
          pytest -q \
            tests/models/test_async_response_close_terminal_unknown.py \
            tests/models/test_responses.py \
            -k 'terminal_unknown or aclose or cannot_aread_after_response_closed or pickle'
      - run: |
          ruff check \
            httpx/_models.py \
            httpx/_client.py \
            tests/models/test_async_response_close_terminal_unknown.py
          mypy httpx
          git diff --check
