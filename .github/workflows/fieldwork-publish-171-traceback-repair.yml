name: Fieldwork execute 171 traceback repair

on:
  pull_request:
    branches:
      - fieldwork/171-terminal-close-source
    paths:
      - .fieldwork/publish_171_traceback_repair.py
      - .github/workflows/fieldwork-publish-171-traceback-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out evidence carrier
        uses: actions/checkout@v4
      - name: Check out exact clean source head
        run: |
          git fetch origin fieldwork/171-terminal-close-source
          git checkout --detach dc8101ef80dfde2aefb304b5e36f1c09e645b0da
          test "$(git rev-parse HEAD)" = dc8101ef80dfde2aefb304b5e36f1c09e645b0da
          test "$(git diff --name-only b5addb64f0161ff6bfe94c124ef76f6a1fba5254...HEAD | sort)" = "$(printf '%s\n' \
            httpx/_client.py \
            httpx/_models.py \
            tests/models/test_async_response_close_terminal_unknown.py | sort)"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
      - name: Install dependencies
        run: scripts/install
      - name: Run focused terminal-close regression
        run: pytest -q tests/models/test_async_response_close_terminal_unknown.py
      - name: Run project checks
        if: matrix.python-version == '3.13'
        run: scripts/check
      - name: Verify clean execution tree
        run: git diff --check
