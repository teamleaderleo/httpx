name: Fieldwork execute 171 traceback repair

on:
  push:
    branches:
      - publish/171-traceback-retention-repair
    paths:
      - .github/workflows/fieldwork-publish-171-traceback-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out publisher
        uses: actions/checkout@v4
      - name: Check out exact clean source head
        run: |
          git fetch origin fieldwork/171-terminal-close-source
          git checkout --detach 27c77e365bd9b9ef930298937db434902c863d24
          test "$(git rev-parse HEAD)" = 27c77e365bd9b9ef930298937db434902c863d24
          test "$(git diff --name-only b5addb64f0161ff6bfe94c124ef76f6a1fba5254...HEAD | sort)" = "$(printf '%s\n' \
            httpx/_client.py \
            httpx/_models.py \
            tests/models/test_async_response_close_terminal_unknown.py | sort)"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
      - name: Install dependencies
        run: scripts/install
      - name: Run focused terminal-close regression
        run: pytest -q tests/models/test_async_response_close_terminal_unknown.py
      - name: Run project checks
        if: matrix.python-version == '3.13'
        run: scripts/check
      - name: Verify clean execution tree
        run: git diff --check

  receipt:
    needs: focused
    runs-on: ubuntu-24.04
    steps:
      - name: Check out publisher branch
        uses: actions/checkout@v4
        with:
          ref: publish/171-traceback-retention-repair
      - name: Retain exact execution receipt
        run: |
          mkdir -p .fieldwork/receipts
          cat > .fieldwork/receipts/171-traceback-repair.txt <<EOF
          source_head=27c77e365bd9b9ef930298937db434902c863d24
          base_head=b5addb64f0161ff6bfe94c124ef76f6a1fba5254
          workflow_run=${{ github.run_id }}
          python_versions=3.9,3.13
          focused_test=tests/models/test_async_response_close_terminal_unknown.py
          python_3_13_check=scripts/check
          result=success
          EOF
          git config user.name "Fieldwork Evidence"
          git config user.email "fieldwork@example.invalid"
          git add .fieldwork/receipts/171-traceback-repair.txt
          git commit -m "record async-close repair execution receipt"
          git push origin HEAD:publish/171-traceback-retention-repair
