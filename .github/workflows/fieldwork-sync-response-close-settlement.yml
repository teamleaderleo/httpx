name: Fieldwork sync response close settlement

on:
  pull_request:
    paths:
      - '.fieldwork/test_sync_response_close_settlement.py'
      - '.github/workflows/fieldwork-sync-response-close-settlement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fieldwork/185-sync-response-close-settlement
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==8.4.1 chardet==5.2.0 trio==0.31.0 ruff==0.12.11 mypy==1.17.1

      - name: Record exact revision
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fieldwork/185-sync-response-close-settlement)"
          python --version
          python -c "import httpx, pytest, trio; print('httpx', httpx.__version__); print('pytest', pytest.__version__); print('trio', trio.__version__)"

      - name: Stage characterization
        run: |
          cp .fieldwork/test_sync_response_close_settlement.py tests/models/test_sync_response_close_settlement.py
          git diff --check

      - name: Run focused characterization
        run: |
          pytest -q -rxX tests/models/test_sync_response_close_settlement.py

      - name: Run adjacent response controls
        run: |
          pytest -q tests/models/test_responses.py -k 'close or sync_streaming_response or cannot_read_after_response_closed'

      - name: Static checks
        run: |
          ruff check httpx/_models.py tests/models/test_sync_response_close_settlement.py
          mypy httpx
