name: Fieldwork sync response close settlement

on:
  pull_request:
    paths:
      - '.fieldwork/test_sync_response_close_settlement.py'
      - '.github/workflows/fieldwork-sync-response-close-settlement.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  characterize:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.9'
          - '3.13'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fieldwork/185-sync-response-close-settlement
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install declared test environment with exact transport dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            httpcore==1.0.9 \
            anyio==4.12.1

      - name: Record exact revision
        run: |
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/fieldwork/185-sync-response-close-settlement)"
          python --version
          python - <<'PY'
          import httpcore
          import httpx
          import pytest
          import trio
          import trustme

          print(f"httpx={httpx.__version__}")
          print(f"httpcore={httpcore.__version__}")
          print(f"pytest={pytest.__version__}")
          print(f"trio={trio.__version__}")
          print(f"trustme={trustme.__version__}")
          PY

      - name: Stage characterization
        run: |
          cp .fieldwork/test_sync_response_close_settlement.py tests/models/test_sync_response_close_settlement.py
          git diff --check

      - name: Run focused characterization
        run: |
          pytest -q -rxX tests/models/test_sync_response_close_settlement.py

      - name: Run adjacent response controls
        run: |
          pytest -q tests/models/test_responses.py -k 'close or sync_streaming_response or cannot_read_after_response_closed'

      - name: Static checks
        run: |
          ruff check httpx/_models.py tests/models/test_sync_response_close_settlement.py
          mypy httpx
