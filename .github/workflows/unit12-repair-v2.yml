name: Unit 12 repair executor

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

concurrency:
  group: unit12-repair-executor
  cancel-in-progress: false

env:
  SOURCE_REF: fieldwork/171-terminal-close-source
  SOURCE_SHA: 18256f10d1b306bdf87a1bab24b214c15839147b
  BASE_SHA: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
  PATCH_PATH: upstream/packets/12-httpx-terminal-async-close/patches/0001-fix-reentrant-close-and-elapsed-sampling.patch

jobs:
  focused:
    name: Focused repair tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/fieldwork
          ref: upstream/12-httpx-terminal-async-close
          path: fieldwork
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Verify exact clean source
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object httpx/_models.py)" = 3ccb5290ceb95d96e24047bcec2897c52de16176
          test "$(git hash-object httpx/_client.py)" = 79934d050cd77414fb6f9c1024f42f6029c924e0
      - name: Apply retained repair
        working-directory: source
        run: |
          git apply --check "../fieldwork/$PATCH_PATH"
          git apply "../fieldwork/$PATCH_PATH"
          test "$(git hash-object httpx/_models.py)" = 0533a7324d0ed45ffb1087570551efcdaed02fa5
          test "$(git hash-object httpx/_client.py)" = 510b41959383dcf78bd311a236afc44dd92d010a
          test "$(git hash-object tests/client/test_async_client_terminal_close_elapsed.py)" = c3a27b2f65f04c723a4fc330f25215dcc6565e1c
          test "$(git hash-object tests/models/test_async_response_close_reentry.py)" = 058459952675150661fbd53795ed8cb9d250ebe1
      - name: Install dependencies
        working-directory: source
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run focused asyncio and Trio controls
        working-directory: source
        run: >-
          python -m pytest -q
          tests/models/test_async_response_close_reentry.py
          tests/models/test_async_response_close_terminal_unknown.py
          tests/models/test_async_response_close_terminal_cancellation.py
          tests/client/test_async_client_terminal_close_elapsed.py
      - name: Diff hygiene
        working-directory: source
        run: git diff --check

  full:
    name: Full repository gates (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/fieldwork
          ref: upstream/12-httpx-terminal-async-close
          path: fieldwork
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: source/requirements.txt
      - name: Verify and apply exact repair
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git apply --check "../fieldwork/$PATCH_PATH"
          git apply "../fieldwork/$PATCH_PATH"
          git diff --check
      - name: Verify exact six-file fence
        working-directory: source
        shell: bash
        run: |
          git add -N tests/models/test_async_response_close_reentry.py
          expected=$(printf '%s\n' \
            httpx/_client.py \
            httpx/_models.py \
            tests/client/test_async_client_terminal_close_elapsed.py \
            tests/models/test_async_response_close_reentry.py \
            tests/models/test_async_response_close_terminal_cancellation.py \
            tests/models/test_async_response_close_terminal_unknown.py | sort)
          actual=$(git diff --name-only "$BASE_SHA" | sort)
          test "$actual" = "$expected"
      - name: Install dependencies
        working-directory: source
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Static checks
        working-directory: source
        run: ./scripts/check
      - name: Package and documentation build
        working-directory: source
        run: ./scripts/build
      - name: Complete suite
        working-directory: source
        run: ./scripts/test
      - name: Enforce complete coverage
        working-directory: source
        run: ./scripts/coverage

  finalize:
    name: Commit clean repaired source
    needs: [focused, full]
    if: github.event.pull_request.head.ref == 'fieldwork/171-terminal-close-repair-carrier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/fieldwork
          ref: upstream/12-httpx-terminal-async-close
          path: fieldwork
      - name: Apply exact repair to clean source
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git apply --check "../fieldwork/$PATCH_PATH"
          git apply "../fieldwork/$PATCH_PATH"
          git add -A
          git diff --cached --check
          expected=$(printf '%s\n' \
            httpx/_client.py \
            httpx/_models.py \
            tests/client/test_async_client_terminal_close_elapsed.py \
            tests/models/test_async_response_close_reentry.py \
            tests/models/test_async_response_close_terminal_cancellation.py \
            tests/models/test_async_response_close_terminal_unknown.py | sort)
          actual=$(git diff --cached --name-only "$BASE_SHA" | sort)
          test "$actual" = "$expected"
      - name: Commit and publish repaired source
        working-directory: source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix inherited async-close reentry and elapsed sampling"
          git push origin HEAD:"$SOURCE_REF"
