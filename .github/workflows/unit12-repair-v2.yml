name: Unit 12 publish verified repair

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: write

concurrency:
  group: unit12-publish-verified-repair
  cancel-in-progress: false

env:
  SOURCE_REF: fieldwork/171-terminal-close-source
  SOURCE_SHA: 18256f10d1b306bdf87a1bab24b214c15839147b
  BASE_SHA: b5addb64f0161ff6bfe94c124ef76f6a1fba5254
  PATCH_PATH: upstream/packets/12-httpx-terminal-async-close/patches/0001-fix-reentrant-close-and-elapsed-sampling.patch

jobs:
  publish:
    name: Publish fully verified six-file repair
    if: github.event.pull_request.head.ref == 'fieldwork/171-terminal-close-repair-carrier'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          path: source
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: teamleaderleo/fieldwork
          ref: e59fb13a0a281be5ed2c94446430f5cb4b97424f
          path: fieldwork
      - name: Verify clean input and apply exact tested patch
        working-directory: source
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git hash-object httpx/_models.py)" = 3ccb5290ceb95d96e24047bcec2897c52de16176
          test "$(git hash-object httpx/_client.py)" = 79934d050cd77414fb6f9c1024f42f6029c924e0
          git apply --check "../fieldwork/$PATCH_PATH"
          git apply "../fieldwork/$PATCH_PATH"
          test "$(git hash-object httpx/_models.py)" = 0533a7324d0ed45ffb1087570551efcdaed02fa5
          test "$(git hash-object httpx/_client.py)" = 510b41959383dcf78bd311a236afc44dd92d010a
          test "$(git hash-object tests/client/test_async_client_terminal_close_elapsed.py)" = 67545aede0ba92364f70dc9f37c5c2e0a010c836
          test "$(git hash-object tests/models/test_async_response_close_reentry.py)" = 0be56b2cb9a9a2e7fabc1a6bc107bbcca520fd67
      - name: Verify exact six-file staged fence
        working-directory: source
        shell: bash
        run: |
          git add -A
          git diff --cached --check
          expected=$(printf '%s\n' \
            httpx/_client.py \
            httpx/_models.py \
            tests/client/test_async_client_terminal_close_elapsed.py \
            tests/models/test_async_response_close_reentry.py \
            tests/models/test_async_response_close_terminal_cancellation.py \
            tests/models/test_async_response_close_terminal_unknown.py | sort)
          actual=$(git diff --cached --name-only "$BASE_SHA" | sort)
          test "$actual" = "$expected"
      - name: Commit and push canonical source
        working-directory: source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix inherited async-close reentry and elapsed sampling"
          git push origin HEAD:"$SOURCE_REF"
