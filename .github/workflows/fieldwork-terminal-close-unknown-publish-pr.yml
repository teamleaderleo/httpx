name: HTTPX terminal close exact-head execution

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fieldwork-terminal-close-unknown-publish-pr.yml'

permissions:
  contents: read

concurrency:
  group: httpx-terminal-close-exact-head
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fieldwork/171-terminal-close-unknown'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - name: Check out exact source-only candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 206b8f50f2cb773d8854646b35f8938bf528dd83
          persist-credentials: false

      - name: Verify exact source fence
        run: |
          test "$(git rev-parse HEAD)" = \
            206b8f50f2cb773d8854646b35f8938bf528dd83
          test -f tests/models/test_async_response_close_terminal_unknown.py
          test -f tests/models/test_async_response_close_terminal_cancellation.py
          test -f tests/client/test_async_client_terminal_close_elapsed.py
          test -z "$(git status --porcelain)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused terminal-close controls
        run: |
          pytest -q \
            tests/models/test_async_response_close_terminal_unknown.py \
            tests/models/test_async_response_close_terminal_cancellation.py \
            tests/client/test_async_client_terminal_close_elapsed.py

      - name: Run complete repository suite
        run: pytest -q

      - name: Run static and complete-diff gates
        if: matrix.python-version == '3.13'
        run: |
          ruff check \
            httpx/_models.py \
            httpx/_client.py \
            tests/models/test_async_response_close_terminal_unknown.py \
            tests/models/test_async_response_close_terminal_cancellation.py \
            tests/client/test_async_client_terminal_close_elapsed.py
          mypy httpx
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
