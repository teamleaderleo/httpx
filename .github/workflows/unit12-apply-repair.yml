name: Unit 12 apply and verify repair

on:
  push:
    branches:
      - fieldwork/171-terminal-close-source

permissions:
  contents: write

concurrency:
  group: unit12-apply-repair
  cancel-in-progress: false

jobs:
  focused:
    name: Focused tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Apply retained repair
        shell: bash
        run: |
          cat > /tmp/unit12-repair.patch <<'PATCH'
          diff --git a/httpx/_client.py b/httpx/_client.py
          index 79934d0..510b419 100755
          --- a/httpx/_client.py
          +++ b/httpx/_client.py
          @@ -177,8 +177,8 @@ class BoundAsyncStream(AsyncByteStream):
                       yield chunk
           
               async def aclose(self) -> None:
          -        await self._stream.aclose()
                   elapsed = time.perf_counter() - self._start
          +        await self._stream.aclose()
                   self._response.elapsed = datetime.timedelta(seconds=elapsed)
           
           
          diff --git a/httpx/_models.py b/httpx/_models.py
          index 3ccb529..781977b 100755
          --- a/httpx/_models.py
          +++ b/httpx/_models.py
          @@ -60,6 +60,7 @@ class _AsyncCloseState:
               def __init__(self) -> None:
                   self.event = anyio.Event()
                   self.failed = False
          +        self.owner_task_id = anyio.get_current_task().id
           
           
           def _new_async_close_error(request: Request | None) -> CloseError:
          @@ -1129,6 +1130,12 @@ class Response:
                           state.event.set()
                           return
           
          +        if state.owner_task_id == anyio.get_current_task().id:
          +            raise CloseError(
          +                "Attempted to re-enter response close from the stream close operation.",
          +                request=self._request,
          +            )
          +
                   await state.event.wait()
                   if state.failed:
                       raise _new_async_close_error(self._request)
          diff --git a/tests/client/test_async_client_terminal_close_elapsed.py b/tests/client/test_async_client_terminal_close_elapsed.py
          index f6ecfbf..c3a27b2 100644
          --- a/tests/client/test_async_client_terminal_close_elapsed.py
          +++ b/tests/client/test_async_client_terminal_close_elapsed.py
          @@ -1,8 +1,10 @@
           from __future__ import annotations
           
          +import anyio
           import pytest
           
           import httpx
          +import httpx._client as client_module
           
           
           class FailingCloseStream(httpx.AsyncByteStream):
          @@ -56,3 +58,61 @@ async def test_elapsed_is_not_published_when_stream_cleanup_fails() -> None:
                       match="may only be accessed after the response has been read or closed",
                   ):
                       _ = response.elapsed
          +
          +
          +class BlockingCloseStream(httpx.AsyncByteStream):
          +    def __init__(self) -> None:
          +        self.started = anyio.Event()
          +        self.release = anyio.Event()
          +
          +    async def __aiter__(self):
          +        if False:  # pragma: no cover
          +            yield b""
          +
          +    async def aclose(self) -> None:
          +        self.started.set()
          +        await self.release.wait()
          +
          +
          +class BlockingCloseTransport(httpx.AsyncBaseTransport):
          +    def __init__(self, stream: BlockingCloseStream) -> None:
          +        self.stream = stream
          +
          +    async def handle_async_request(self, request: httpx.Request) -> httpx.Response:
          +        return httpx.Response(200, request=request, stream=self.stream)
          +
          +
          +class Clock:
          +    def __init__(self, value: float) -> None:
          +        self.value = value
          +
          +    def __call__(self) -> float:
          +        return self.value
          +
          +
          +@pytest.mark.anyio
          +async def test_elapsed_excludes_stream_cleanup_latency(
          +    monkeypatch: pytest.MonkeyPatch,
          +) -> None:
          +    clock = Clock(10.0)
          +    monkeypatch.setattr(client_module.time, "perf_counter", clock)
          +    stream = BlockingCloseStream()
          +    transport = BlockingCloseTransport(stream)
          +    client = httpx.AsyncClient(transport=transport)
          +    request = client.build_request("GET", "https://example.org")
          +    response = await client.send(request, stream=True)
          +    clock.value = 12.0
          +
          +    async with anyio.create_task_group() as task_group:
          +        task_group.start_soon(response.aclose)
          +        await stream.started.wait()
          +        with pytest.raises(
          +            RuntimeError,
          +            match="may only be accessed after the response has been read or closed",
          +        ):
          +            _ = response.elapsed
          +        clock.value = 20.0
          +        stream.release.set()
          +
          +    assert response.elapsed.total_seconds() == 2.0
          +    await client.aclose()
          diff --git a/tests/models/test_async_response_close_reentry.py b/tests/models/test_async_response_close_reentry.py
          new file mode 100644
          index 0000000..f6ede0c
          --- /dev/null
          +++ b/tests/models/test_async_response_close_reentry.py
          @@ -0,0 +1,122 @@
          +from __future__ import annotations
          +
          +import anyio
          +import pytest
          +
          +import httpx
          +
          +REENTRY_MESSAGE = "Attempted to re-enter response close from the stream close operation."
          +
          +
          +def assert_error_request(
          +    error: httpx.CloseError, request: httpx.Request | None
          +) -> None:
          +    if request is None:
          +        with pytest.raises(RuntimeError):
          +            _ = error.request
          +    else:
          +        assert error.request is request
          +
          +
          +class EscapingReentrantStream(httpx.AsyncByteStream):
          +    def __init__(self) -> None:
          +        self.response: httpx.Response | None = None
          +        self.close_calls = 0
          +
          +    async def __aiter__(self):
          +        if False:  # pragma: no cover
          +            yield b""
          +
          +    async def aclose(self) -> None:
          +        self.close_calls += 1
          +        assert self.response is not None
          +        await self.response.aclose()
          +
          +
          +@pytest.mark.anyio
          +@pytest.mark.parametrize("with_request", [False, True])
          +async def test_reentrant_close_fails_without_waiting(with_request: bool) -> None:
          +    request = httpx.Request("GET", "https://example.org") if with_request else None
          +    stream = EscapingReentrantStream()
          +    response = httpx.Response(200, request=request, stream=stream)
          +    stream.response = response
          +
          +    with anyio.fail_after(1):
          +        with pytest.raises(httpx.CloseError, match=REENTRY_MESSAGE) as owner:
          +            await response.aclose()
          +
          +    assert_error_request(owner.value, request)
          +    assert stream.close_calls == 1
          +    assert response.is_closed is False
          +
          +    with pytest.raises(httpx.CloseError, match="close outcome is unknown") as later:
          +        await response.aclose()
          +    assert_error_request(later.value, request)
          +    assert later.value is not owner.value
          +    assert stream.close_calls == 1
          +
          +
          +class CatchingReentrantStream(httpx.AsyncByteStream):
          +    def __init__(self) -> None:
          +        self.response: httpx.Response | None = None
          +        self.started = anyio.Event()
          +        self.allow_reentry = anyio.Event()
          +        self.close_calls = 0
          +        self.reentry_error: httpx.CloseError | None = None
          +
          +    async def __aiter__(self):
          +        if False:  # pragma: no cover
          +            yield b""
          +
          +    async def aclose(self) -> None:
          +        self.close_calls += 1
          +        self.started.set()
          +        await self.allow_reentry.wait()
          +        assert self.response is not None
          +        try:
          +            await self.response.aclose()
          +        except httpx.CloseError as error:
          +            self.reentry_error = error
          +
          +
          +@pytest.mark.anyio
          +async def test_caught_reentrant_close_does_not_poison_external_waiter() -> None:
          +    request = httpx.Request("GET", "https://example.org")
          +    stream = CatchingReentrantStream()
          +    response = httpx.Response(200, request=request, stream=stream)
          +    stream.response = response
          +    waiter_started = anyio.Event()
          +    waiter_done = anyio.Event()
          +    errors: list[BaseException] = []
          +
          +    async def owner() -> None:
          +        try:
          +            await response.aclose()
          +        except BaseException as error:
          +            errors.append(error)
          +
          +    async def waiter() -> None:
          +        waiter_started.set()
          +        try:
          +            await response.aclose()
          +        except BaseException as error:
          +            errors.append(error)
          +        finally:
          +            waiter_done.set()
          +
          +    with anyio.fail_after(1):
          +        async with anyio.create_task_group() as task_group:
          +            task_group.start_soon(owner)
          +            await stream.started.wait()
          +            task_group.start_soon(waiter)
          +            await waiter_started.wait()
          +            await anyio.sleep(0)
          +            assert not waiter_done.is_set()
          +            stream.allow_reentry.set()
          +
          +    assert errors == []
          +    assert stream.close_calls == 1
          +    assert response.is_closed is True
          +    assert stream.reentry_error is not None
          +    assert stream.reentry_error.args == (REENTRY_MESSAGE,)
          +    assert stream.reentry_error.request is request
          PATCH
          git apply --check /tmp/unit12-repair.patch
          git apply /tmp/unit12-repair.patch
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run focused async-close tests
        run: >-
          python -m pytest -q
          tests/models/test_async_response_close_reentry.py
          tests/models/test_async_response_close_terminal_unknown.py
          tests/models/test_async_response_close_terminal_cancellation.py
          tests/client/test_async_client_terminal_close_elapsed.py

  full:
    name: Full repository gates (Python 3.13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Apply retained repair
        shell: bash
        run: |
          sed -n '/^          diff --git /,$p' .github/workflows/unit12-apply-repair.yml \
            | sed 's/^          //' \
            | sed '/^          PATCH$/,$d' > /tmp/unit12-repair.patch
          git apply --check /tmp/unit12-repair.patch
          git apply /tmp/unit12-repair.patch
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Static checks
        run: ./scripts/check
      - name: Full suite with coverage
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=100
      - name: Package and docs
        run: |
          python -m build
          twine check dist/*
          mkdocs build --strict
      - name: Diff hygiene
        run: |
          git diff --check
          test -z "$(git status --short --untracked-files=no | grep -v '^ M httpx/_client.py$' | grep -v '^ M httpx/_models.py$' | grep -v '^ M tests/client/test_async_client_terminal_close_elapsed.py$')"

  finalize:
    name: Commit clean repaired source
    needs: [focused, full]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fieldwork/171-terminal-close-source
          fetch-depth: 0
      - name: Apply repair and remove execution workflow
        shell: bash
        run: |
          sed -n '/^          diff --git /,$p' .github/workflows/unit12-apply-repair.yml \
            | sed 's/^          //' \
            | sed '/^          PATCH$/,$d' > /tmp/unit12-repair.patch
          git apply --check /tmp/unit12-repair.patch
          git apply /tmp/unit12-repair.patch
          git rm .github/workflows/unit12-apply-repair.yml
          git add -A
          git diff --cached --check
          expected=$(printf '%s\n' \
            httpx/_client.py \
            httpx/_models.py \
            tests/client/test_async_client_terminal_close_elapsed.py \
            tests/models/test_async_response_close_reentry.py \
            tests/models/test_async_response_close_terminal_cancellation.py \
            tests/models/test_async_response_close_terminal_unknown.py | sort)
          actual=$(git diff --cached --name-only b5addb64f0161ff6bfe94c124ef76f6a1fba5254 | sort)
          test "$actual" = "$expected"
      - name: Commit repaired source
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Fix reentrant async close and elapsed sampling"
          git push origin HEAD:fieldwork/171-terminal-close-source
